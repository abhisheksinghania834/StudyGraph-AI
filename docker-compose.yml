services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
      FALKORDB_GRAPH: studygraph
    depends_on:
      - falkordb
volumes:
  falkordb_data:
